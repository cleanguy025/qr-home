<!doctype html>
<html lang="vi" data-state="opening">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mở ứng dụng BIDV Home</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        'use strict';

        /* =====================================================================
         * CẤU HÌNH — chỉ cần sửa trong khối này
         * ===================================================================*/
        var CONFIG = {
          // Store mặc định — giữ đồng bộ với
          // src/app/pages/utilities/constants/download-app.const.ts
          IOS_STORE: 'https://apps.apple.com/vn/app/bidv-home/id1482737401',
          ANDROID_STORE:
            'https://play.google.com/store/apps/details?id=vn.com.bidv.bidvhome',

          // 3 môi trường, khớp với .well-known/assetlinks.json và
          // .well-known/apple-app-site-association.
          //
          // pathPrefix = path app khai trong AASA. Nó vừa là điều kiện để iOS
          // chịu mở app, vừa là dấu hiệu nhận biết môi trường ngay trên URL nên
          // không cần thêm param. AASA khai /Ga5k cho CẢ sit lẫn uat; ở đây gán
          // /Ga5k -> sit và dùng /SyXu (riêng của uat) để phân biệt.
          //
          // scheme = custom URL scheme riêng của từng bản app. PHẢI khác nhau
          // giữa 3 môi trường, nếu không máy cài 2 bản sẽ mở nhầm app (custom
          // scheme không có cơ chế xác thực chủ sở hữu như Universal Link).
          //
          // iosStore/androidStore chỉ khai khi khác store mặc định ở trên.
          ENV: {
            prod: {
              pathPrefix: '/E9Y8',
              androidPackage: 'vn.com.bidv.bidvhome',
              scheme: '',
            },
            uat: {
              pathPrefix: '/SyXu',
              androidPackage: 'vn.com.bidv.bidvhome.uat',
              scheme: '',
            },
            sit: {
              pathPrefix: '/Ga5k',
              androidPackage: 'vn.com.bidv.bidvhome.sit',
              scheme: '',
            },
          },

          // Dùng khi URL không nằm dưới pathPrefix nào và cũng không có ?env=
          DEFAULT_ENV: 'prod',

          // Fallback khi ENV.scheme để trống — dùng khi cả 3 bản app dùng chung
          // một scheme. Là cách DUY NHẤT mở được app khi trang này không nằm
          // trên domain mà app đã khai (applinks: / intent-filter).
          // Cả ENV.scheme lẫn cái này đều trống = chỉ dựa vào Universal Link.
          APP_SCHEME: '',

          // Phần đứng sau scheme:// — vd 'open' cho bidvhome://open/promo/123
          APP_SCHEME_HOST: 'open',

          // Chờ bao lâu trước khi rơi về store nếu app không mở được (ms)
          STORE_FALLBACK_DELAY: 1500,

          // Param điều khiển trang này, KHÔNG truyền sang app
          CONTROL_PARAMS: ['noapp', 'env'],

          // Thư mục con nếu site không chạy ở root domain, vd '/qr-home' với
          // GitHub Pages project site. Phần này bị cắt khỏi path truyền cho app.
          BASE_PATH: '',
        };

        /* =====================================================================
         * Nhận diện thiết bị
         * ===================================================================*/
        var ua = navigator.userAgent || navigator.vendor || '';

        // iPadOS 13+ giả dạng "Macintosh" -> nhận diện qua touch points
        var isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        var isAndroid = /Android/.test(ua);

        // Webview trong app khác (FB/IG/Zalo...) hay chặn intent:// và custom
        // scheme -> vẫn thử, nhưng hiện sẵn nút bấm tay để không bị kẹt trang trắng
        var isInAppBrowser =
          /FBAN|FBAV|Instagram|Line\/|Zalo|MicroMessenger|TikTok/i.test(ua);

        /* =====================================================================
         * Query param: lọc param điều khiển, giữ lại phần truyền cho app
         * ===================================================================*/
        function getParam(name) {
          var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
          return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
        }

        // Chuỗi query sẽ được chuyển tiếp vào app (đã bỏ param điều khiển)
        var appQuery = (function () {
          var raw = location.search.replace(/^\?/, '');
          if (!raw) return '';
          var kept = [];
          var parts = raw.split('&');
          for (var i = 0; i < parts.length; i++) {
            if (!parts[i]) continue;
            var key = decodeURIComponent(parts[i].split('=')[0]);
            if (CONFIG.CONTROL_PARAMS.indexOf(key) === -1) kept.push(parts[i]);
          }
          return kept.length ? '?' + kept.join('&') : '';
        })();

        /* =====================================================================
         * Môi trường: prod | uat | sit
         * ===================================================================*/

        function startsWithSegment(path, prefix) {
          return path === prefix || path.indexOf(prefix + '/') === 0;
        }

        // Path đã bỏ BASE_PATH (thư mục hosting, không liên quan tới app)
        var sitePath = (function () {
          var p = location.pathname;
          var base = CONFIG.BASE_PATH;
          if (base && p.indexOf(base) === 0) p = p.slice(base.length);
          return p.charAt(0) === '/' ? p : '/' + p;
        })();

        // Thứ tự ưu tiên: ?env= > pathPrefix trên URL > DEFAULT_ENV
        var envName = (function () {
          var forced = getParam('env').toLowerCase();
          if (forced && CONFIG.ENV[forced]) return forced;

          for (var name in CONFIG.ENV) {
            if (!Object.prototype.hasOwnProperty.call(CONFIG.ENV, name)) continue;
            var prefix = CONFIG.ENV[name].pathPrefix;
            if (prefix && startsWithSegment(sitePath, prefix)) return name;
          }
          return CONFIG.DEFAULT_ENV;
        })();

        var ENV = CONFIG.ENV[envName] || CONFIG.ENV[CONFIG.DEFAULT_ENV];

        var store = isIOS
          ? ENV.iosStore || CONFIG.IOS_STORE
          : isAndroid
            ? ENV.androidStore || CONFIG.ANDROID_STORE
            : null;

        // Scheme riêng của env, không khai thì dùng scheme chung
        var appScheme = ENV.scheme || CONFIG.APP_SCHEME;
        var appSchemeHost = ENV.schemeHost || CONFIG.APP_SCHEME_HOST;

        // Path truyền cho app: bỏ nốt pathPrefix (định danh môi trường), chỉ còn
        // route thật. /E9Y8/promo/123 -> /promo/123
        //
        // Cắt theo prefix THỰC SỰ có trên URL, không theo ENV đã chọn — vì
        // ?env= có thể trỏ sang môi trường khác với prefix đang đứng.
        var appPath = (function () {
          var p = sitePath;
          for (var name in CONFIG.ENV) {
            if (!Object.prototype.hasOwnProperty.call(CONFIG.ENV, name)) continue;
            var prefix = CONFIG.ENV[name].pathPrefix;
            if (prefix && startsWithSegment(p, prefix)) {
              p = p.slice(prefix.length);
              break;
            }
          }
          if (p.charAt(0) !== '/') p = '/' + p;
          return p === '/' ? '' : p;
        })();

        /* =====================================================================
         * Deep link theo từng nền tảng
         * ===================================================================*/

        // Android: intent:// nhắm thẳng package -> mở app nếu đã cài (không cần
        // App Links đã verify), chưa cài thì Chrome tự đưa về browser_fallback_url.
        // URL data giữ nguyên host + path + query nên app nhận đúng param.
        function androidIntentUrl() {
          var pkg = ENV.androidPackage;
          var scheme, data;

          if (appScheme) {
            // Scheme riêng của app -> mở được từ BẤT KỲ domain nào
            scheme = appScheme;
            data = appSchemeHost + appPath + appQuery;
          } else {
            // Dựa vào intent-filter https của app -> chỉ khớp khi app đã khai
            // đúng host này, nếu không Chrome sẽ rơi thẳng về store
            scheme = location.protocol.replace(':', '');
            data = location.host + location.pathname + appQuery;
          }

          return (
            'intent://' +
            data +
            '#Intent;scheme=' +
            scheme +
            ';package=' +
            pkg +
            ';S.browser_fallback_url=' +
            encodeURIComponent(store) +
            ';end'
          );
        }

        // iOS: Universal Link đã bị bỏ lỡ (nếu bắt được thì trang này không load),
        // nên chỉ còn custom scheme. Không cấu hình scheme -> trả null.
        function iosAppUrl() {
          if (!appScheme) return null;
          return appScheme + '://' + appSchemeHost + appPath + appQuery;
        }

        var appUrl = isAndroid
          ? androidIntentUrl()
          : isIOS
            ? iosAppUrl()
            : null;

        /* =====================================================================
         * Điều hướng
         * ===================================================================*/
        var fallbackTimer = null;

        function cancelFallback() {
          if (fallbackTimer) {
            clearTimeout(fallbackTimer);
            fallbackTimer = null;
          }
        }

        // App đã mở -> trang bị ẩn đi -> huỷ việc nhảy sang store
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) cancelFallback();
        });
        window.addEventListener('pagehide', cancelFallback);
        window.addEventListener('blur', cancelFallback);

        function showChooser() {
          cancelFallback();
          document.documentElement.setAttribute('data-state', 'choose');
        }

        function goStore() {
          if (store) location.replace(store);
          else showChooser();
        }

        function openApp() {
          if (!appUrl) {
            goStore();
            return;
          }

          cancelFallback();
          fallbackTimer = setTimeout(function () {
            // Trình duyệt không xử lý được intent:// hoặc scheme -> về store
            fallbackTimer = null;
            if (document.hidden) return;
            goStore();
          }, CONFIG.STORE_FALLBACK_DELAY);

          try {
            location.href = appUrl;
          } catch (e) {
            cancelFallback();
            goStore();
          }
        }

        // Nút bấm tay trên màn hình fallback
        window.__openApp = function () {
          if (appUrl) openApp();
          else if (store) location.href = store;
        };

        function start() {
          // Desktop / không nhận diện được -> chọn thủ công
          if (!isIOS && !isAndroid) {
            showChooser();
            return;
          }

          // ?noapp=1 -> bỏ qua mở app, đi thẳng store (dùng cho nút "Tải app")
          if (getParam('noapp')) {
            goStore();
            return;
          }

          // Webview trong app khác: hiện sẵn nút để không kẹt trang trắng
          if (isInAppBrowser) showChooser();

          if (appUrl) openApp();
          else goStore();
        }

        start();
      })();
    </script>
    <style>
      :root {
        --green: #00674a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        margin: 1rem;
        padding: 2rem 1.5rem;
        background: #fff;
        border-radius: 1.25rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
        color: var(--green);
      }
      p {
        margin: 0 0 1.5rem;
        color: #475569;
        font-size: 0.9rem;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      a.btn,
      button.btn {
        display: block;
        width: 100%;
        padding: 0.85rem 1rem;
        border: 0;
        border-radius: 9999px;
        text-decoration: none;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: var(--green);
        color: #fff;
      }
      a.btn.secondary,
      button.btn.secondary {
        background: #fff;
        color: var(--green);
        border: 1px solid var(--green);
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        margin: 0 auto 1rem;
        border: 3px solid #e2e8f0;
        border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }

      /* Hiển thị theo trạng thái: opening (mặc định) | choose */
      #opening,
      #choose {
        display: none;
      }
      html[data-state='opening'] #opening {
        display: block;
      }
      html[data-state='choose'] #choose {
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card" id="opening">
        <div class="spinner"></div>
        <h1>Đang mở ứng dụng BIDV Home</h1>
        <p>Vui lòng chờ trong giây lát…</p>
      </div>

      <div class="card" id="choose">
        <h1>Ứng dụng BIDV Home</h1>
        <p>Mở ứng dụng nếu đã cài, hoặc tải về từ kho ứng dụng:</p>
        <div class="links">
          <button class="btn" type="button" onclick="window.__openApp()">
            Mở ứng dụng
          </button>
          <a
            class="btn secondary"
            href="https://apps.apple.com/vn/app/bidv-home/id1482737401"
            >App Store (iPhone / iPad)</a
          >
          <a
            class="btn secondary"
            href="https://play.google.com/store/apps/details?id=vn.com.bidv.bidvhome"
            >CH Play (Android)</a
          >
        </div>
      </div>
    </main>

    <noscript>
      <style>
        #opening {
          display: none !important;
        }
        #choose {
          display: block !important;
        }
      </style>
    </noscript>
  </body>
</html>
