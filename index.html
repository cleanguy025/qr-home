<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tải ứng dụng BIDV Home</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        'use strict';

        // URL store — giữ đồng bộ với src/app/pages/utilities/constants/download-app.const.ts
        var STORE = {
          IOS: 'https://apps.apple.com/vn/app/bidv-home/id1482737401',
          ANDROID:
            'https://play.google.com/store/apps/details?id=vn.com.bidv.bidvhome',
        };

        var ua = navigator.userAgent || navigator.vendor || '';

        // iPadOS 13+ giả dạng "Macintosh" -> nhận diện qua touch points
        var isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        var isAndroid = /Android/.test(ua);

        var target = isIOS ? STORE.IOS : isAndroid ? STORE.ANDROID : null;

        if (target) {
          // replace: không để lại lịch sử trang trung gian
          location.replace(target);
        } else {
          // Desktop / không nhận diện được: hiện trang chọn thủ công
          document.documentElement.setAttribute('data-fallback', 'true');
        }
      })();
    </script>
    <style>
      :root {
        --green: #00674a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      /* Mặc định ẩn; chỉ hiện khi là fallback desktop */
      main {
        display: none;
      }
      html[data-fallback='true'] main {
        display: block;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        margin: 1rem;
        padding: 2rem 1.5rem;
        background: #fff;
        border-radius: 1.25rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
        color: var(--green);
      }
      p {
        margin: 0 0 1.5rem;
        color: #475569;
        font-size: 0.9rem;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      a.btn {
        display: block;
        padding: 0.85rem 1rem;
        border-radius: 9999px;
        text-decoration: none;
        font-weight: 600;
        background: var(--green);
        color: #fff;
      }
      a.btn.secondary {
        background: #fff;
        color: var(--green);
        border: 1px solid var(--green);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Tải ứng dụng BIDV Home</h1>
        <p>Chọn kho ứng dụng phù hợp với thiết bị của bạn:</p>
        <div class="links">
          <a
            class="btn"
            href="https://apps.apple.com/vn/app/bidv-home/id1482737401"
            >App Store (iPhone / iPad)</a
          >
          <a
            class="btn secondary"
            href="https://play.google.com/store/apps/details?id=vn.com.bidv.bidvhome"
            >CH Play (Android)</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
